name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 31.177.82.167
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /opt/crm
            sudo -u crm git fetch --all --prune
            sudo -u crm git reset --hard origin/main
            bash deploy/deploy.sh
